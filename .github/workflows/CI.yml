name: CI
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # A pre-release or nightly failure is information, not a broken build.
    continue-on-error: ${{ matrix.experimental }}
    permissions: # needed to allow julia-actions/cache to proactively delete old caches that it has created
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # 'min' resolves the lower bound of the julia compat entry in Project.toml, so the
        # matrix follows the declared support window instead of having to be edited alongside
        # it; '1' is the current stable release.
        version:
          - 'min'
          - '1'
        os:
          - ubuntu-latest
          - macOS-latest
          - windows-latest
        arch:
          # 'default' is the runner's native architecture, which is aarch64 on macOS-latest;
          # a hardcoded 'x64' would test Julia under Rosetta there.
          - default
        experimental:
          - false
        include:
          - version: 'lts'
            os: ubuntu-latest
            arch: default
            experimental: false
          - version: 'pre'
            os: ubuntu-latest
            arch: default
            experimental: true
          - version: 'nightly'
            os: ubuntu-latest
            arch: default
            experimental: true
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
